name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build site
        run: npm run build
        working-directory: frontend

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: frontend/dist
          retention-days: 7

      - name: Verify artifact upload
        if: ${{ steps.pages_artifact.outputs.artifact_id == '' }}
        run: |
          echo "::error::Pages artifact upload did not return an artifact ID."
          exit 1


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages
